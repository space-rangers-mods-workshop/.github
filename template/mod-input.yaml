# Empty YAML template for a workshop mod.
# Copy to <mod>/<mod>.yaml — inside the mod's own repo folder. This YAML is the
# single source the tools read: generate_card.py, generate_instruction.py,
# build_mod.py and publish_mod.py. Fill every <...> in.
#
# HARD RULES: info.Priority = 1, info.Section = Разное, info.SectionEng = Miscellaneous
# (the workshop publishes every mod under the Miscellaneous section) — never change these.
#
# Schema in design.md, section "Input: YAML per mod".

mod: <mod>   # id = the mod's repo folder in the workshop

# public — keys mirror ModuleInfo.txt; rendered into mod/ModuleInfo.txt by build_mod.py
# and into the card README.md by generate_card.py. Public text is English, except
# proper names (authors, verbatim in-game text), which stay as they are.
info:
  Name: <mod name>
  Author: "<the whole author list>"   # source authors + everyone who assembled this version
  Conflict: ""                        # comma-separated ModuleInfo names, or ""
  Dependence: ""                      # comma-separated ModuleInfo names, or "" (empty -> no Dependence line)
  Priority: 1                         # hard rule
  Section: Разное                     # hard rule
  SectionEng: Miscellaneous           # hard rule — the deploy folder under Mods\
  Languages: Rus,Eng
  SmallDescription: >-
    <short Russian description>
  SmallDescriptionEng: >-
    <short English description>
  FullDescription: >-
    <full Russian description>
  FullDescriptionEng: >-
    <full English description>
  # nexusmods: "https://www.nexusmods.com/..."   # optional; the card shows it when present

# public — the sources this mod is based on / derived from (museum exhibits, source
# packs); may be empty. Rendered verbatim in the card's "## 🔗 Based on" section.
based_on:
  - source: <url>
    note: <short label — may be omitted>

# public — what this workshop edition changed relative to its sources; linked from the
# card README.md. Short bullets, one change per line; may be empty for a mod unpacked
# as-is. The reproducible commands/paths live in the mod's build scripts and patches/,
# not here.
changes:
  - <change>
